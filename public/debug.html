<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素办公室 · 调试页</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #14161a; color: #d8dee6; font-size: 13px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1c1f26; border-bottom: 1px solid #2a2e38; }
  header h1 { font-size: 14px; margin: 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #e5534b; }
  #dot.ok { background: #57ab5a; }
  main { display: grid; grid-template-columns: 320px 1fr 1fr; gap: 12px; padding: 12px 16px; }
  section { background: #1c1f26; border: 1px solid #2a2e38; border-radius: 8px; padding: 12px; min-height: 80vh; }
  h2 { font-size: 12px; margin: 0 0 10px; color: #8b949e; letter-spacing: 1px; }
  .bar { margin-bottom: 10px; }
  .bar label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #adbac7; }
  .track { height: 12px; background: #2a2e38; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .4s; }
  #f-energy { background: #eac54f; } #f-mood { background: #f47067; } #f-focus { background: #6cb6ff; }
  .kv { display: flex; gap: 14px; margin: 10px 0; color: #adbac7; }
  .kv b { color: #eac54f; }
  button { background: #2a2e38; color: #d8dee6; border: 1px solid #3d4451; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 12px; margin: 2px 4px 2px 0; }
  button:hover { background: #3d4451; }
  button.primary { background: #316dca; border-color: #4184e4; }
  button.danger { background: #8b2c34; border-color: #b04550; }
  input { background: #14161a; border: 1px solid #3d4451; color: #d8dee6; border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 12px; width: 100%; margin: 3px 0; }
  select { background: #14161a; border: 1px solid #3d4451; color: #d8dee6; border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 12px; width: 100%; margin: 3px 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 6px; border-bottom: 1px solid #23272f; word-break: break-all; }
  li:last-child { border-bottom: none; }
  .card { border: 1px solid #3d4451; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #20242c; }
  .card.draft { border-color: #eac54f; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #2a2e38; color: #8b949e; margin-right: 6px; }
  .tag.group_msg { background: #1f3d5c; color: #6cb6ff; }
  .tag.at_me { background: #5c1f24; color: #f47067; }
  .tag.o2o_msg { background: #24461f; color: #8ddb8c; }
  .tag.todo_added,.tag.todo_done,.tag.todo_near_due,.tag.todo_overdue { background: #43341c; color: #eac54f; }
  .dim { color: #636e7b; }
  .clock-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .clock-strip input { width: auto; flex: 0 1 170px; margin: 0; padding: 3px 6px; font-size: 11px; }
  .clock-strip button { margin: 0; padding: 3px 8px; font-size: 11px; }
  .toggles { display: flex; flex-direction: column; gap: 6px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #adbac7; }
  .toggles input[type=checkbox] { width: auto; margin: 0; accent-color: #316dca; }
  .tier { font-weight: bold; }
  .tier-兴奋 { color: #eac54f; } .tier-开心 { color: #8ddb8c; } .tier-平静 { color: #6cb6ff; } .tier-疲惫 { color: #dc8850; } .tier-倦怠 { color: #f47067; }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <h1>像素办公室 · P2 调试页</h1>
  <span class="dim" id="conn">未连接</span>
</header>
<main>
  <section>
    <h2>小人状态</h2>
    <div class="bar"><label>能量 <span id="v-energy">-</span></label><div class="track"><div class="fill" id="f-energy"></div></div></div>
    <div class="bar"><label>心情 <span id="v-mood">-</span></label><div class="track"><div class="fill" id="f-mood"></div></div></div>
    <div class="bar"><label>专注 <span id="v-focus">-</span></label><div class="track"><div class="fill" id="f-focus"></div></div></div>
    <div class="kv">
      <span>金币 <b id="v-coins">0</b></span>
      <span>Lv <b id="v-level">1</b></span>
      <span>XP <span id="v-xp">0</span></span>
      <span>今日完成 <span id="v-done">0</span></span>
    </div>
    <div class="kv">心情档位：<span class="tier" id="v-tier">-</span>　<span class="dim" id="v-rest"></span></div>
    <div class="kv clock-strip">
      <span class="dim">时钟</span><b id="v-clock-now">-</b><span class="dim" id="v-clock-phase"></span><span class="dim" id="v-clock-mode"></span>
      <button id="btn-natural" title="切回自然时间">自然</button>
      <input id="manual-dt" type="datetime-local" step="60">
      <button class="primary" id="btn-manual">设定</button>
    </div>
    <h2 style="margin-top:16px">AI 千仔</h2>
    <input id="chat" placeholder="自然语言指令（需配置 LLM）" onkeydown="if(event.key==='Enter')chat()">
    <button class="primary" onclick="chat()">发送</button>
    <h2 style="margin-top:16px">卡片</h2>
    <div id="cards"></div>
  </section>

  <section>
    <h2>调整属性</h2>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
      <select id="adj-stat" style="flex:1;background:#14161a;border:1px solid #3d4451;color:#d8dee6;border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12px">
        <option value="energy">能量</option>
        <option value="mood">心情</option>
        <option value="focus">专注</option>
        <option value="coins">金币</option>
      </select>
      <input id="adj-delta" type="number" value="10" style="width:80px" placeholder="数值">
      <button class="primary" id="adj-add">＋加</button>
      <button class="danger" id="adj-sub">－减</button>
    </div>

    <h2>面板弹出（游戏内）</h2>
    <select id="panel-img">
      <option value="/assets/objects/time_clock.png">打卡机</option>
      <option value="/assets/objects/coffee_machine.png">咖啡机</option>
    </select>
    <input id="panel-text" placeholder="面板文字">
    <button class="primary" id="btn-panel">弹出面板</button>

    <h2 style="margin-top:16px">对话框弹出（游戏内）</h2>
    <select id="dlg-portrait">
      <optgroup label="角色头像（PNG）">
        <option value="/assets/portrait_char_boss.png">老板</option>
        <option value="/assets/portrait_char_xiaolan.png">小蓝·同事</option>
        <option value="/assets/portrait_char_xiaocheng.png">小橙·同事</option>
      </optgroup>
      <optgroup label="主角状态图">
        <option value="/assets/portrait_normal.png">正常</option>
        <option value="/assets/portrait_happy.png">开心</option>
        <option value="/assets/portrait_tired.png">疲惫</option>
        <option value="/assets/portrait_angry.png">生气</option>
      </optgroup>
    </select>
    <input id="dlg-text" placeholder="对话文字">
    <button class="primary" id="btn-dialog">弹出对话框</button>

    <h2 style="margin-top:16px">角色 / 界面开关</h2>
    <div class="toggles">
      <label><input type="checkbox" id="tg-qz" checked> 千仔</label>
      <label><input type="checkbox" id="tg-workers" checked> 两名同事</label>
      <label><input type="checkbox" id="tg-boss" checked> 老板</label>
      <label><input type="checkbox" id="tg-phone"> 手机界面</label>
    </div>

    <h2 style="margin-top:16px">手机消息推送</h2>
    <select id="pm-from">
      <option value="boss">老板</option>
      <option value="xiaomei">小美</option>
    </select>
    <input id="pm-text" placeholder="消息内容">
    <button class="primary" id="btn-phone-msg">发一条消息</button>

    <h2 style="margin-top:16px">头顶气泡（游戏内）</h2>
    <select id="bb-target">
      <option value="player">玩家</option>
      <option value="boss">老板</option>
      <option value="worker0">小蓝（同事）</option>
      <option value="worker1">小橙（同事）</option>
      <option value="qz">千仔</option>
    </select>
    <input id="bb-text" placeholder="气泡内容">
    <button class="primary" id="btn-bubble">冒一个气泡</button>
  </section>

  <section>
    <h2>事件流</h2>
    <ul id="events"></ul>
  </section>
</main>
<script>
let ws, state = null, lastClock = null;
const $ = (id) => document.getElementById(id);
const tierClass = (t) => 'tier tier-' + t;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { $('dot').classList.add('ok'); $('conn').textContent = `ws://${location.host} 已连接`; };
  ws.onclose = () => { $('dot').classList.remove('ok'); $('conn').textContent = '断开，3 秒后重连'; setTimeout(connect, 3000); };
  ws.onmessage = (e) => route(JSON.parse(e.data));
}

function route(msg) {
  switch (msg.type) {
    case 'state': state = msg.state; renderState(); break;
    case 'game_event': addEvent(msg); break;
    case 'agent_card': addCard(msg); break;
    case 'notice': addEvent({ kind: 'notice', payload: { text: msg.text }, ts: msg.ts }); break;
    case 'time': renderClock(msg); break;
  }
}

function renderClock(msg) {
  lastClock = msg;
  $('v-clock-now').textContent = new Date(msg.now).toLocaleString('zh-CN', { hour12: false });
  $('v-clock-phase').textContent = msg.phase;
  $('v-clock-mode').textContent = msg.mode === 'manual' ? '（人工）' : '（自然）';
}

function renderState() {
  const s = state; if (!s) return;
  $('v-energy').textContent = `${s.energy} / ${s.energyCap}`;
  $('f-energy').style.width = `${Math.min(100, s.energy / s.energyCap * 100)}%`;
  $('v-mood').textContent = s.mood;
  $('f-mood').style.width = `${s.mood}%`;
  $('v-focus').textContent = s.focus;
  $('f-focus').style.width = `${s.focus}%`;
  $('v-coins').textContent = s.coins;
  $('v-level').textContent = s.level;
  $('v-xp').textContent = s.xp;
  $('v-done').textContent = s.completedToday;
  $('v-tier').textContent = s.moodTier;
  $('v-tier').className = tierClass(s.moodTier);
  $('v-rest').textContent = s.resting ? '休息中…' : '';
}

function addEvent(msg) {
  const ul = $('events');
  const li = document.createElement('li');
  const time = new Date(msg.ts).toLocaleTimeString('zh-CN', { hour12: false });
  let body = '';
  const p = msg.payload || {};
  if (msg.kind === 'group_msg' || msg.kind === 'at_me' || msg.kind === 'o2o_msg') {
    body = `${p.sender || '?'}: ${p.text || ''}`;
  } else if (msg.kind === 'notice') {
    body = p.text || '';
  } else {
    body = `[${p.taskId || ''}] ${p.subject || ''}`;
  }
  li.innerHTML = `<span class="dim">${time}</span> <span class="tag ${msg.kind}">${msg.kind}</span>${body.replace(/</g, '&lt;')}`;
  ul.prepend(li);
  while (ul.children.length > 100) ul.removeChild(ul.lastChild);
}

function addCard(msg) {
  const box = $('cards');
  if (msg.stage === 'draft') {
    const div = document.createElement('div');
    div.className = 'card draft';
    div.innerHTML = `<div class="dim">草稿确认</div><pre style="white-space:pre-wrap;margin:6px 0">${(msg.preview || '').replace(/</g, '&lt;')}</pre>`;
    const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = '确认执行';
    const no = document.createElement('button'); no.className = 'danger'; no.textContent = '取消';
    ok.onclick = () => { send({ type: 'confirm', requestId: msg.requestId, approved: true }); div.remove(); };
    no.onclick = () => { send({ type: 'confirm', requestId: msg.requestId, approved: false }); div.remove(); };
    div.append(ok, no);
    box.prepend(div);
    return;
  }
  const div = document.createElement('div');
  div.className = 'card';
  const label = msg.stage === 'tool' ? `调用 ${msg.tool}` : (msg.tool ? `[${msg.tool}] ` : '');
  div.textContent = label + (msg.text || '');
  box.prepend(div);
  while (box.children.length > 20) box.removeChild(box.lastChild);
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function act(name, params) { send({ type: 'action', name, params: params || {} }); }
function chat() { const el = $('chat'); if (!el.value.trim()) return; send({ type: 'agent_chat', text: el.value.trim() }); el.value = ''; }
$('btn-natural').onclick = () => send({ type: 'set_time', mode: 'natural' });
function adjust(sign) {
  const stat = $('adj-stat').value;
  const v = Number($('adj-delta').value);
  if (!Number.isFinite(v) || v <= 0) return;
  send({ type: 'adjust_stat', stat, delta: sign * v });
}
$('adj-add').onclick = () => adjust(1);
$('adj-sub').onclick = () => adjust(-1);
$('btn-panel').onclick = () => {
  const text = $('panel-text').value.trim();
  if (!text) return;
  send({ type: 'debug_ui', kind: 'panel', image: $('panel-img').value, text });
};
$('btn-dialog').onclick = () => {
  const text = $('dlg-text').value.trim();
  if (!text) return;
  send({ type: 'debug_ui', kind: 'dialog', portrait: $('dlg-portrait').value, text });
};
// 角色/界面显隐开关
for (const target of ['qz', 'workers', 'boss', 'phone']) {
  $('tg-' + target).onchange = (e) => send({ type: 'debug_ui', kind: 'toggle', target, show: e.target.checked });
}
// 手机消息推送
$('btn-phone-msg').onclick = () => {
  const text = $('pm-text').value.trim();
  if (!text) return;
  send({ type: 'debug_ui', kind: 'phone_msg', from: $('pm-from').value, text });
  $('pm-text').value = '';
};
// 头顶气泡
$('btn-bubble').onclick = () => {
  const text = $('bb-text').value.trim();
  if (!text) return;
  send({ type: 'debug_ui', kind: 'bubble', target: $('bb-target').value, text });
  $('bb-text').value = '';
};
$('btn-manual').onclick = () => {
  const v = $('manual-dt').value; // "YYYY-MM-DDTHH:mm"
  if (!v) { $('v-clock-mode').textContent = '（请先选择日期时间）'; return; }
  const ms = new Date(v).getTime();
  if (Number.isFinite(ms)) { send({ type: 'set_time', mode: 'manual', ms }); $('v-clock-mode').textContent = '（已发送…）'; }
};
connect();
</script>
</body>
</html>
